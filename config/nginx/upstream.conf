# configuration file /etc/nginx/upstream.conf:
upstream php {
    server 127.0.0.1:9000 fail_timeout=0;
}

map $http_x_forwarded_proto $fastcgi_https {
    default off;
    # In a proxy chain the original value comes first, e.g. "https, http".
    ~*^http\b '';
    ~*^https\b on;
}

map $http_x_forwarded_proto $fastcgi_server_port {
    default $server_port;
    # Normalize the first/original scheme to the corresponding public port.
    ~*^http\b 80;
    ~*^https\b 443;
}
