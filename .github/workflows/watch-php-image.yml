# Ablage im Repository: .github/workflows/watch-php-image.yml
# Einrichtung: Repository-Variable NOTIFY_USER auf deinen GitHub-Benutzernamen
# setzen und Issues im Repository aktivieren. Kein eigener Token erforderlich.
name: PHP-Image verfügbar?

on:
  workflow_dispatch:
  schedule:
    # Alle 30 Minuten, außerhalb der vollen Stunde; Cron-Zeiten in UTC.
    - cron: "7,37 * * * *"

permissions:
  issues: write

# Verhindert doppelte Meldungen durch gleichzeitig laufende Prüfungen.
concurrency:
  group: watch-php-image
  cancel-in-progress: false

env:
  IMAGE: docker.io/library/php:8.5.12-fpm-alpine
  PLATFORM: linux/amd64
  EXPECTED_PHP_VERSION: "8.5.12"
  NOTIFY_USER: mbuechner
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Image prüfen und einmalig benachrichtigen
        uses: actions/github-script@v9
        with:
          script: |
            const image = process.env.IMAGE;
            const platform = process.env.PLATFORM;
            const expected = process.env.EXPECTED_PHP_VERSION;
            const notifyUser = (process.env.NOTIFY_USER || "").trim().replace(/^@/, "");

            if (!/^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/i.test(notifyUser)) {
              throw new Error("Setze die Repository-Variable NOTIFY_USER auf deinen GitHub-Benutzernamen.");
            }

            // Das Issue ist der dauerhafte Merker; auch geschlossene Issues zählen.
            const marker = `<!-- php-image-watch:${image}|${platform}|${expected} -->`;
            for await (const { data } of github.paginate.iterator(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "all", per_page: 100 }
            )) {
              const previous = data.find(issue =>
                !issue.pull_request && (issue.body || "").includes(marker)
              );
              if (previous) {
                core.info(`Bereits benachrichtigt: ${previous.html_url}`);
                await core.summary
                  .addHeading("Bereits benachrichtigt")
                  .addLink(`Issue #${previous.number}`, previous.html_url)
                  .write();
                return;
              }
            }

            // Ein erfolgreicher Pull bestätigt auch die gewählte Plattform.
            const pull = await exec.getExecOutput("docker", [
              "pull", "--platform", platform, image
            ], { ignoreReturnCode: true });

            if (pull.exitCode !== 0) {
              const message = `${pull.stdout}\n${pull.stderr}`;
              const unavailable = /manifest unknown|manifest for [^\r\n]+ not found|no matching manifest for|no match for platform in manifest/i.test(message);
              if (!unavailable) {
                throw new Error("Docker-Abruf fehlgeschlagen. Details stehen im Log; der Fehler wird nicht als fehlendes Image behandelt.");
              }
              core.info("Das Image ist für die gewünschte Plattform noch nicht verfügbar.");
              await core.summary
                .addHeading("Noch nicht verfügbar")
                .addRaw(`Image: ${image}\n\nPlattform: ${platform}\n\nDie nächste geplante Prüfung folgt automatisch.`)
                .write();
              return;
            }

            // Exakt das gerade heruntergeladene Image über seine lokale ID starten.
            const inspected = await exec.getExecOutput("docker", [
              "image", "inspect", image, "--format", "{{json .}}"
            ], { silent: true });
            const metadata = JSON.parse(inspected.stdout);
            const checked = await exec.getExecOutput("docker", [
              "run", "--rm", "--pull=never", "--platform", platform,
              metadata.Id, "php", "-r", "echo PHP_VERSION;"
            ], { silent: true });
            const version = checked.stdout.trim();
            if (version !== expected) {
              throw new Error(`Unerwartete PHP-Version: ${version}; erwartet: ${expected}.`);
            }
            const digest = metadata.RepoDigests?.[0] || metadata.Id;
            core.info(`Bestätigt: PHP ${version}, ${platform}, ${digest}`);

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "",
              `@${notifyUser}: Das PHP-Image ist für die gewünschte Plattform verfügbar.`,
              "",
              `- Image: \`${image}\``,
              `- Plattform: \`${platform}\``,
              `- Bestätigte PHP-Version: \`${version}\``,
              `- Digest: \`${digest}\``,
              `- Geprüft am: ${new Date().toISOString()}`,
              "",
              "Das Image wurde im GitHub-Runner heruntergeladen und PHP erfolgreich gestartet.",
              "",
              `[Prüflauf öffnen](${runUrl})`,
              "",
              "Du kannst dieses Issue schließen; das erzeugt keine erneute Meldung."
            ].join("\n");

            // Keine automatischen POST-Retries: Der nächste Lauf prüft zuerst
            // wieder, ob das Issue bereits existiert.
            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title: `Verfügbar: ${image} (${platform})`,
              body
            });
            await core.summary
              .addHeading("PHP-Image verfügbar")
              .addLink("Benachrichtigung öffnen", issue.html_url)
              .write();
