name: Publish Helm chart

on:
  push:
    branches:
      - master
      - test
    paths:
      - helm/ddbgo/**
      - .github/workflows/helm-publish.yml
  workflow_dispatch:

concurrency:
  group: publish-ddbgo-helm-chart
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CHART_DIR: helm/ddbgo
  HELM_VERSION: v4.2.0
  REGISTRY: ghcr.io
  OCI_NAMESPACE: helm

jobs:
  publish:
    name: Lint, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and render chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint "$CHART_DIR" \
            --namespace test-release \
            --set 'naming.allowedReleaseNames={test-release}' \
            --strict
          helm lint "$CHART_DIR" \
            --namespace test-release \
            --set 'naming.allowedReleaseNames={test-release}' \
            --values "$CHART_DIR/values-kubernetes.yaml" \
            --strict
          helm template ddbgo "$CHART_DIR" \
            --namespace ddbgo >/dev/null
          helm template ddbgo-t "$CHART_DIR" \
            --namespace ddbgo-t \
            --values "$CHART_DIR/values-test.yaml" >/dev/null
          kubernetes_render="$RUNNER_TEMP/ddbgo-kubernetes.yaml"
          helm template ddbgo "$CHART_DIR" \
            --namespace ddbgo \
            --values "$CHART_DIR/values-kubernetes.yaml" >"$kubernetes_render"
          if grep -Eq 'route\.openshift\.io|image\.openshift\.io' "$kubernetes_render"; then
            echo '::error::Kubernetes profile contains an OpenShift API or trigger annotation.'
            exit 1
          fi
          helm template ddbgo-t "$CHART_DIR" \
            --namespace ddbgo-t \
            --values "$CHART_DIR/values-test.yaml" \
            --values "$CHART_DIR/values-kubernetes.yaml" >/dev/null

      - name: Resolve release channel and package chart
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          chart_name="$(awk '$1 == "name:" { print $2; exit }' "$CHART_DIR/Chart.yaml")"
          base_version="$(awk '$1 == "version:" { gsub(/\"/, "", $2); print $2; exit }' "$CHART_DIR/Chart.yaml")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_dir="$RUNNER_TEMP/helm-packages"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Chart.yaml version must be a stable MAJOR.MINOR.PATCH version."
            exit 1
          fi

          case "$GITHUB_REF_NAME" in
            test)
              channel="test"
              pages_channel="test"
              chart_version="${base_version}-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.sha${GITHUB_SHA::7}"
              release_name="ddbgo-t"
              release_namespace="ddbgo-t"
              values_file="values-test.yaml"
              ;;
            master)
              channel="production"
              pages_channel="stable"
              chart_version="$base_version"
              release_name="ddbgo"
              release_namespace="ddbgo"
              values_file=""
              ;;
            *)
              echo "::error::Publishing is allowed only from the test or master branch."
              exit 1
              ;;
          esac

          package="$package_dir/${chart_name}-${chart_version}.tgz"
          repository="oci://${REGISTRY}/${owner}/${OCI_NAMESPACE}"
          reference="${repository}/${chart_name}"

          mkdir -p "$package_dir"
          helm package "$CHART_DIR" \
            --version "$chart_version" \
            --destination "$package_dir"

          test -f "$package"
          echo "name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pages-channel=$pages_channel" >> "$GITHUB_OUTPUT"
          echo "base-version=$base_version" >> "$GITHUB_OUTPUT"
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "release-name=$release_name" >> "$GITHUB_OUTPUT"
          echo "release-namespace=$release_namespace" >> "$GITHUB_OUTPUT"
          echo "values-file=$values_file" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GHCR_USERNAME" \
            --password-stdin

      - name: Check existing OCI chart version
        id: oci
        shell: bash
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
          CHART_REFERENCE: ${{ steps.chart.outputs.reference }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail

          set +e
          lookup_output="$(helm show chart "$CHART_REFERENCE" --version "$CHART_VERSION" 2>&1)"
          lookup_status=$?
          set -e

          if [[ $lookup_status -eq 0 ]]; then
            compare_dir="$RUNNER_TEMP/compare-oci"
            mkdir -p "$compare_dir/local" "$compare_dir/remote" "$compare_dir/download"
            helm pull "$CHART_REFERENCE" \
              --version "$CHART_VERSION" \
              --destination "$compare_dir/download"
            tar -xzf "$CHART_PACKAGE" -C "$compare_dir/local"
            tar -xzf "$compare_dir/download/${CHART_NAME}-${CHART_VERSION}.tgz" \
              -C "$compare_dir/remote"

            if ! diff -qr \
              "$compare_dir/local/$CHART_NAME" \
              "$compare_dir/remote/$CHART_NAME"; then
              echo "::error::${CHART_REFERENCE}:${CHART_VERSION} exists with different content. Increase version in Chart.yaml."
              exit 1
            fi

            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "OCI chart ${CHART_REFERENCE}:${CHART_VERSION} already exists with identical content; keeping it unchanged."
          elif grep -Eiq 'not found|manifest unknown|name unknown' <<<"$lookup_output"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "$lookup_output" >&2
            echo '::error::Could not safely determine whether the OCI chart version already exists.'
            exit 1
          fi

      - name: Publish chart to GHCR
        if: steps.oci.outputs.exists != 'true'
        shell: bash
        env:
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
          CHART_REPOSITORY: ${{ steps.chart.outputs.repository }}
        run: |
          set -euo pipefail
          helm push "$CHART_PACKAGE" "$CHART_REPOSITORY"

      - name: Publish classic Helm repository to GitHub Pages
        id: pages
        shell: bash
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_PACKAGE: ${{ steps.chart.outputs.package }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          PAGES_CHANNEL: ${{ steps.chart.outputs['pages-channel'] }}
        run: |
          set -euo pipefail

          pages_dir="$RUNNER_TEMP/gh-pages"
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_base_url="https://${owner}.github.io/${repo_name}"
          repository_url="${pages_base_url}/helm/${PAGES_CHANNEL}"

          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          else
            git worktree add --detach "$pages_dir" HEAD
            git -C "$pages_dir" switch --orphan gh-pages
            git -C "$pages_dir" rm -rf --ignore-unmatch .
          fi

          channel_dir="$pages_dir/helm/$PAGES_CHANNEL"
          target_package="$channel_dir/${CHART_NAME}-${CHART_VERSION}.tgz"
          mkdir -p "$channel_dir"

          if [[ -e "$target_package" ]]; then
            compare_dir="$RUNNER_TEMP/compare-pages"
            mkdir -p "$compare_dir/local" "$compare_dir/published"
            tar -xzf "$CHART_PACKAGE" -C "$compare_dir/local"
            tar -xzf "$target_package" -C "$compare_dir/published"
            if ! diff -qr \
              "$compare_dir/local/$CHART_NAME" \
              "$compare_dir/published/$CHART_NAME"; then
              echo "::error::$target_package exists with different content. Refusing to overwrite it."
              exit 1
            fi
            echo "GitHub Pages package already exists with identical content; keeping it unchanged."
          else
            cp "$CHART_PACKAGE" "$target_package"
          fi

          if [[ ! -f "$channel_dir/index.yaml" ]] || \
             ! grep -Fq "version: $CHART_VERSION" "$channel_dir/index.yaml"; then
            helm repo index "$channel_dir" --url "$repository_url"
          fi

          touch "$pages_dir/.nojekyll"
          if [[ ! -f "$pages_dir/index.html" ]]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="de"><head><meta charset="utf-8"><title>DDBgo Helm-Repositories</title></head>' \
              '<body><h1>DDBgo Helm-Repositories</h1><ul>' \
              '<li><a href="helm/stable/index.yaml">Stable</a></li>' \
              '<li><a href="helm/test/index.yaml">Test</a></li>' \
              '</ul></body></html>' > "$pages_dir/index.html"
          fi

          git -C "$pages_dir" config user.name 'github-actions[bot]'
          git -C "$pages_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pages_dir" add .nojekyll index.html helm

          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit \
              -m "Publish ${CHART_NAME} ${CHART_VERSION} to ${PAGES_CHANNEL}"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi

          echo "repository-url=$repository_url" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        shell: bash
        env:
          CHART_REFERENCE: ${{ steps.chart.outputs.reference }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          PAGES_REPOSITORY: ${{ steps.pages.outputs['repository-url'] }}
        run: |
          {
            echo '## Helm chart published'
            echo
            echo "\`${CHART_REFERENCE}\`"
            echo
            echo "Channel: \`${{ steps.chart.outputs.channel }}\`"
            echo
            echo "Version: \`${CHART_VERSION}\`"
            echo
            echo "OpenShift repository: \`${PAGES_REPOSITORY}\`"
            echo
            echo '```sh'
            if [[ '${{ steps.chart.outputs.channel }}' == 'test' ]]; then
              echo "helm upgrade --install ddbgo-t ${CHART_REFERENCE} --version ${CHART_VERSION} --namespace ddbgo-t --values helm/ddbgo/values-test.yaml"
            else
              echo "helm upgrade --install ddbgo ${CHART_REFERENCE} --version ${CHART_VERSION} --namespace ddbgo"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
