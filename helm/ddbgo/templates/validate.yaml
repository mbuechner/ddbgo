{{- if .Values.naming.enforceReleaseNamespaceMatch }}
{{- if ne .Release.Name .Release.Namespace }}
{{- fail (printf "release name %q must match namespace %q" .Release.Name .Release.Namespace) }}
{{- end }}
{{- end }}
{{- if .Values.naming.allowedReleaseNames }}
{{- if not (has .Release.Name .Values.naming.allowedReleaseNames) }}
{{- fail (printf "release name %q is not allowed; expected one of: %s" .Release.Name (join ", " .Values.naming.allowedReleaseNames)) }}
{{- end }}
{{- end }}
{{- $commonAnnotations := .Values.commonAnnotations | default dict -}}
{{- if or (hasKey $commonAnnotations "meta.helm.sh/release-name") (hasKey $commonAnnotations "meta.helm.sh/release-namespace") (hasKey $commonAnnotations "helm.sh/resource-policy") }}
{{- fail "commonAnnotations must not override Helm ownership or resource-policy annotations" }}
{{- end }}
{{- if lt (int .Values.drupal.dependencyChecks.retryIntervalSeconds) 1 }}
{{- fail "drupal.dependencyChecks.retryIntervalSeconds must be at least 1" }}
{{- end }}
{{- if not (has .Values.verticalPodAutoscaler.updateMode (list "Off" "Initial" "Recreate" "InPlaceOrRecreate" "InPlace" "Auto")) }}
{{- fail "verticalPodAutoscaler.updateMode must be one of Off, Initial, Recreate, InPlaceOrRecreate, InPlace or Auto" }}
{{- end }}
{{- if not (has .Values.verticalPodAutoscaler.controlledValues (list "RequestsAndLimits" "RequestsOnly")) }}
{{- fail "verticalPodAutoscaler.controlledValues must be RequestsAndLimits or RequestsOnly" }}
{{- end }}
{{- if or (ne (len .Values.verticalPodAutoscaler.controlledResources) 2) (not (has "cpu" .Values.verticalPodAutoscaler.controlledResources)) (not (has "memory" .Values.verticalPodAutoscaler.controlledResources)) }}
{{- fail "verticalPodAutoscaler.controlledResources must contain exactly cpu and memory" }}
{{- end }}
{{- if not (has .Values.drupal.env.UPDATEDB_ON_STARTUP (list "yes" "no")) }}
{{- fail "drupal.env.UPDATEDB_ON_STARTUP must be yes or no" }}
{{- end }}
{{- if not (has .Values.drupal.env.CACHEREBUILD_ON_STARTUP (list "yes" "no")) }}
{{- fail "drupal.env.CACHEREBUILD_ON_STARTUP must be yes or no" }}
{{- end }}
{{- if or (and .Values.drupal.env.HTPASSWD_USER (not .Values.drupal.env.HTPASSWD_PWD)) (and .Values.drupal.env.HTPASSWD_PWD (not .Values.drupal.env.HTPASSWD_USER)) }}
{{- fail "drupal.env.HTPASSWD_USER and drupal.env.HTPASSWD_PWD must either both be set or both be empty" }}
{{- end }}
{{- if and .Values.drupal.basicAuth.existingSecret (or .Values.drupal.env.HTPASSWD_USER .Values.drupal.env.HTPASSWD_PWD) }}
{{- fail "drupal.basicAuth.existingSecret is mutually exclusive with drupal.env.HTPASSWD_USER and drupal.env.HTPASSWD_PWD" }}
{{- end }}
{{- if and .Values.drupal.secret.create .Values.drupal.secret.existingSecret }}
{{- fail "drupal.secret.create and drupal.secret.existingSecret are mutually exclusive" }}
{{- end }}
{{- if and (not .Values.drupal.secret.create) (not .Values.drupal.secret.existingSecret) }}
{{- fail "drupal.secret.existingSecret is required when drupal.secret.create=false" }}
{{- end }}
{{- if and .Values.redis.secret.create .Values.redis.secret.existingSecret }}
{{- fail "redis.secret.create and redis.secret.existingSecret are mutually exclusive" }}
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.secret.create) (not .Values.redis.secret.existingSecret) }}
{{- fail "redis.secret.existingSecret is required when redis.secret.create=false" }}
{{- end }}
{{- if and .Values.redis.secret.password (not (regexMatch "^[A-Za-z0-9]{16,128}$" .Values.redis.secret.password)) }}
{{- fail "redis.secret.password must contain 16 to 128 ASCII letters or digits so it is safe in a Redis ACL" }}
{{- end }}
{{- if and .Values.database.auth.create .Values.database.auth.existingSecret }}
{{- fail "database.auth.create and database.auth.existingSecret are mutually exclusive" }}
{{- end }}
{{- if not .Values.database.enabled }}
{{- fail "database.enabled must be true because this application requires MariaDB" }}
{{- end }}
{{- if not (has .Values.database.config.transactionIsolation (list "READ-UNCOMMITTED" "READ-COMMITTED" "REPEATABLE-READ" "SERIALIZABLE")) }}
{{- fail "database.config.transactionIsolation must be one of READ-UNCOMMITTED, READ-COMMITTED, REPEATABLE-READ or SERIALIZABLE" }}
{{- end }}
{{- if and (not .Values.database.auth.create) (not .Values.database.auth.existingSecret) }}
{{- fail "database.auth.existingSecret is required when database.auth.create=false" }}
{{- end }}
{{- if and .Values.drupal.persistence.create .Values.drupal.persistence.existingClaim }}
{{- fail "drupal.persistence.create and drupal.persistence.existingClaim are mutually exclusive" }}
{{- end }}
{{- if and (not .Values.drupal.persistence.create) (not .Values.drupal.persistence.existingClaim) }}
{{- fail "drupal.persistence.existingClaim is required when drupal.persistence.create=false" }}
{{- end }}
{{- if and .Values.redis.persistence.create .Values.redis.persistence.existingClaim }}
{{- fail "redis.persistence.create and redis.persistence.existingClaim are mutually exclusive" }}
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.persistence.create) (not .Values.redis.persistence.existingClaim) }}
{{- fail "redis.persistence.existingClaim is required when redis.persistence.create=false" }}
{{- end }}
{{- if and .Values.database.persistence.create .Values.database.persistence.existingClaim }}
{{- fail "database.persistence.create and database.persistence.existingClaim are mutually exclusive" }}
{{- end }}
{{- if and (not .Values.database.persistence.create) (not .Values.database.persistence.existingClaim) }}
{{- fail "database.persistence.existingClaim is required when database.persistence.create=false" }}
{{- end }}
{{- $persistentComponents := list
      (dict "enabled" true "component" "drupal" "name" (include "ddbgo.drupalClaimName" .) "persistence" .Values.drupal.persistence)
      (dict "enabled" .Values.redis.enabled "component" "redis" "name" (include "ddbgo.redisClaimName" .) "persistence" .Values.redis.persistence)
      (dict "enabled" .Values.database.enabled "component" "database" "name" (include "ddbgo.databaseClaimName" .) "persistence" .Values.database.persistence) -}}
{{- range $item := $persistentComponents }}
  {{- if $item.enabled }}
    {{- if not (has "ReadWriteMany" $item.persistence.accessModes) }}
      {{- fail (printf "%s.persistence.accessModes must contain ReadWriteMany because shared access is required" $item.component) -}}
    {{- end }}
    {{- $existingClaim := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $item.name -}}
    {{- if $existingClaim }}
      {{- $existingAccessModes := dig "spec" "accessModes" (list) $existingClaim -}}
      {{- if not (has "ReadWriteMany" $existingAccessModes) }}
        {{- fail (printf "PersistentVolumeClaim %s/%s does not provide required ReadWriteMany access; migrate its data to an RWX-capable volume before installing or upgrading" $.Release.Namespace $item.name) -}}
      {{- end }}
      {{- if and (eq $item.component "database") $.Release.IsInstall $.Values.database.auth.create -}}
        {{- $databaseSecretName := include "ddbgo.databaseSecretName" $ -}}
        {{- $existingDatabaseSecret := lookup "v1" "Secret" $.Release.Namespace $databaseSecretName -}}
        {{- if and (not $existingDatabaseSecret) (or (not $.Values.database.auth.password) (not $.Values.database.auth.rootPassword)) -}}
          {{- fail (printf "retained MariaDB PVC %s/%s exists but Secret %s is missing; refusing to generate credentials that cannot match the initialized database. Supply the original password and rootPassword or set database.auth.create=false with an externally managed existingSecret" $.Release.Namespace $item.name $databaseSecretName) -}}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- $publicPath := .Values.drupal.config.filePublicPath -}}
{{- $privatePath := .Values.drupal.config.filePrivatePath -}}
{{- $tempPath := .Values.drupal.config.tempPath -}}
{{- $webRoot := include "ddbgo.drupalWebRoot" . -}}
{{- if or (not $publicPath) (hasPrefix "/" $publicPath) (regexMatch "(^|/)\\.{1,2}($|/)" $publicPath) }}
{{- fail "drupal.config.filePublicPath must be a non-empty relative path below /var/www/html/web without . or .. segments" }}
{{- end }}
{{- if or (not $privatePath) (not (hasPrefix "/" $privatePath)) }}
{{- fail "drupal.config.filePrivatePath must be an absolute path" }}
{{- end }}
{{- if or (eq $privatePath $webRoot) (hasPrefix (printf "%s/" $webRoot) $privatePath) }}
{{- fail "drupal.config.filePrivatePath must be outside the Drupal web root /var/www/html/web" }}
{{- end }}
{{- if or (not $tempPath) (not (hasPrefix "/" $tempPath)) }}
{{- fail "drupal.config.tempPath must be an absolute path" }}
{{- end }}
{{- if not .Values.drupal.externalHost }}
{{- fail "drupal.externalHost must not be empty because it defines the Route and trusted host" }}
{{- end }}
{{- if and .Values.drupal.config.drushOptionsUri (not (or (hasPrefix "https://" .Values.drupal.config.drushOptionsUri) (hasPrefix "http://" .Values.drupal.config.drushOptionsUri))) }}
{{- fail "drupal.config.drushOptionsUri must start with http:// or https://" }}
{{- end }}
