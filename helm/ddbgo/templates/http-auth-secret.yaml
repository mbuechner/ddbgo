{{- if and (not .Values.drupal.basicAuth.existingSecret) .Values.drupal.env.HTPASSWD_USER .Values.drupal.env.HTPASSWD_PWD }}
{{- $name := include "ddbgo.httpAuthSecretName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $username := .Values.drupal.env.HTPASSWD_USER | b64enc -}}
{{- $password := .Values.drupal.env.HTPASSWD_PWD | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- $username = (get (default (dict) $existing.data) "HTPASSWD_USER") | default $username -}}
  {{- $password = (get (default (dict) $existing.data) "HTPASSWD_PWD") | default $password -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  HTPASSWD_USER: {{ $username | quote }}
  HTPASSWD_PWD: {{ $password | quote }}
{{- end }}
