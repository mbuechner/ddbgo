{{- if .Values.redis.enabled }}
{{- $name := include "ddbgo.redisName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "apps/v1" "kind" "StatefulSet" "name" $name) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
    {{- if and (eq .Values.platform.type "openshift") .Values.redis.image.autoUpdate.enabled }}
    image.openshift.io/triggers: {{ include "ddbgo.imageTrigger" (dict "root" . "name" $name "tag" .Values.redis.image.tag "container" "redis") | quote }}
    {{- end }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ddbgo.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ddbgo.selectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
      annotations:
        ddbgo.de/chart-version: {{ .Chart.Version | quote }}
      {{- with .Values.redis.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ddbgo.redisServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.redis.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-storage
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |-
              mkdir -p /storage/data
              PASSWORD_HASH="$(printf '%s' "${REDIS_PASSWORD}" | sha256sum)"
              PASSWORD_HASH="${PASSWORD_HASH%% *}"
              printf 'user default on #%s ~* &* +@all\n' "${PASSWORD_HASH}" > /generated-redis-auth/users.acl
              chmod 0440 /generated-redis-auth/users.acl
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.redisSecretName" . }}
                  key: password
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: redis-auth
              mountPath: /generated-redis-auth
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --aclfile
            - /generated-redis-auth/users.acl
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.redisSecretName" . }}
                  key: password
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(redis-cli ping 2>/dev/null)" = "PONG"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(redis-cli ping 2>/dev/null)" = "PONG"
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(redis-cli ping 2>/dev/null)" = "PONG"
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: redis-auth
              mountPath: /generated-redis-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ddbgo.redisClaimName" . }}
        - name: redis-auth
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
