{{- $claims := list
      (dict "enabled" .Values.drupal.persistence.create "existing" .Values.drupal.persistence.existingClaim "name" (include "ddbgo.drupalName" .) "component" "drupal" "persistence" .Values.drupal.persistence)
      (dict "enabled" (and .Values.redis.enabled .Values.redis.persistence.create) "existing" .Values.redis.persistence.existingClaim "name" (include "ddbgo.redisName" .) "component" "redis" "persistence" .Values.redis.persistence)
      (dict "enabled" (and .Values.database.enabled .Values.database.persistence.create) "existing" .Values.database.persistence.existingClaim "name" (include "ddbgo.databaseName" .) "component" "db" "persistence" .Values.database.persistence) -}}
{{- range $claim := $claims }}
{{- if and $claim.enabled (not $claim.existing) }}
{{- include "ddbgo.assertAvailable" (dict "root" $ "apiVersion" "v1" "kind" "PersistentVolumeClaim" "name" $claim.name) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $claim.component }}
  annotations:
    {{- include "ddbgo.protectionAnnotations" $ | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $claim.persistence.accessModes | nindent 4 }}
  {{- with $claim.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $claim.persistence.size }}
---
{{- end }}
{{- end }}

