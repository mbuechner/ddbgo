{{- if and .Values.drupal.secret.create (not .Values.drupal.secret.existingSecret) }}
{{- $name := include "ddbgo.drupalName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name) }}
{{- $hashSalt := .Values.drupal.secret.hashSalt | default (randAlphaNum 64) | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (not .Release.IsInstall) -}}
  {{- $hashSalt = (get (default (dict) $existing.data) "hash-salt") | default $hashSalt -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
type: Opaque
immutable: true
data:
  hash-salt: {{ $hashSalt | quote }}
{{- end }}

