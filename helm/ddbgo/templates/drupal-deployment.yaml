{{- $name := include "ddbgo.drupalName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "apps/v1" "kind" "Deployment" "name" $name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
    {{- if .Values.drupal.image.autoUpdate.enabled }}
    image.openshift.io/triggers: {{ include "ddbgo.imageTrigger" (dict "root" . "name" $name "tag" .Values.drupal.image.tag "container" "drupal") | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.drupal.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ddbgo.selectorLabels" (dict "root" . "component" "drupal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ddbgo.selectorLabels" (dict "root" . "component" "drupal") | nindent 8 }}
      annotations:
        ddbgo.de/chart-version: {{ .Chart.Version | quote }}
      {{- with .Values.drupal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ddbgo.drupalServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.drupal.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-database
          image: {{ printf "%s:%s" .Values.database.image.repository .Values.database.image.tag | quote }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until mariadb \
                --protocol=TCP \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                --execute="SELECT 1" \
                "${MYSQL_DATABASE}" >/dev/null 2>&1; do
                echo "Waiting for MariaDB at ${MYSQL_HOST}:${MYSQL_PORT} ..."
                sleep "${WAIT_INTERVAL_SECONDS}"
              done
              echo "MariaDB accepts authenticated connections."
          env:
            - name: MYSQL_HOST
              value: {{ include "ddbgo.databaseName" . | quote }}
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: password
            - name: WAIT_INTERVAL_SECONDS
              value: {{ .Values.drupal.dependencyChecks.retryIntervalSeconds | quote }}
          securityContext:
            {{- toYaml .Values.database.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.drupal.dependencyChecks.resources | nindent 12 }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                REDIS_RESPONSE="$(redis-cli --host "${REDIS_HOST}" --port "${REDIS_PORT}" ping 2>&1)" || true
                if [ "${REDIS_RESPONSE}" = "PONG" ]; then
                  echo "Redis accepts authenticated connections."
                  break
                fi
                echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}; response: ${REDIS_RESPONSE}"
                sleep "${WAIT_INTERVAL_SECONDS}"
              done
          env:
            - name: REDIS_HOST
              value: {{ include "ddbgo.redisName" . | quote }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.redisSecretName" . }}
                  key: password
            - name: WAIT_INTERVAL_SECONDS
              value: {{ .Values.drupal.dependencyChecks.retryIntervalSeconds | quote }}
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.drupal.dependencyChecks.resources | nindent 12 }}
        {{- end }}
        - name: prepare-storage
          image: {{ printf "%s:%s" .Values.drupal.image.repository .Values.drupal.image.tag | quote }}
          imagePullPolicy: {{ .Values.drupal.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - mkdir -p /storage/data/public /storage/data/private
          securityContext:
            {{- toYaml .Values.drupal.securityContext | nindent 12 }}
          volumeMounts:
            - name: drupal-data
              mountPath: /storage
      containers:
        - name: drupal
          image: {{ printf "%s:%s" .Values.drupal.image.repository .Values.drupal.image.tag | quote }}
          imagePullPolicy: {{ .Values.drupal.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.drupal.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            - name: HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.drupalSecretName" . }}
                  key: hash-salt
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: password
            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.redisSecretName" . }}
                  key: password
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.drupal.probes.path | quote }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: {{ .Values.drupal.probes.hostHeader | quote }}
            periodSeconds: {{ .Values.drupal.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.drupal.probes.path | quote }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: {{ .Values.drupal.probes.hostHeader | quote }}
            periodSeconds: {{ .Values.drupal.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.drupal.probes.path | quote }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: {{ .Values.drupal.probes.hostHeader | quote }}
            periodSeconds: {{ .Values.drupal.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.drupal.resources | nindent 12 }}
          volumeMounts:
            - name: drupal-data
              mountPath: {{ include "ddbgo.drupalPublicFilesMountPath" . | quote }}
              subPath: data/public
            - name: drupal-data
              mountPath: {{ .Values.drupal.config.filePrivatePath | quote }}
              subPath: data/private
            - name: tmp
              mountPath: {{ .Values.drupal.config.tempPath | quote }}
      volumes:
        - name: drupal-data
          persistentVolumeClaim:
            claimName: {{ include "ddbgo.drupalClaimName" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.drupal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
