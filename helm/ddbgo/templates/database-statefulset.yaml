{{- if .Values.database.enabled }}
{{- $name := include "ddbgo.databaseName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "apps/v1" "kind" "StatefulSet" "name" $name) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
    {{- if .Values.database.image.autoUpdate.enabled }}
    image.openshift.io/triggers: {{ include "ddbgo.imageTrigger" (dict "root" . "name" $name "tag" .Values.database.image.tag "container" "mariadb") | quote }}
    {{- end }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ddbgo.selectorLabels" (dict "root" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ddbgo.selectorLabels" (dict "root" . "component" "db") | nindent 8 }}
      annotations:
        ddbgo.de/chart-version: {{ .Chart.Version | quote }}
      {{- with .Values.database.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ddbgo.databaseServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.database.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-storage
          image: {{ printf "%s:%s" .Values.database.image.repository .Values.database.image.tag | quote }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |-
              mkdir -p /storage/data
              if [ ! -w /run/mariadb ]; then
                echo "MariaDB runtime directory /run/mariadb is not writable" >&2
                exit 1
              fi
          securityContext:
            {{- toYaml .Values.database.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: runtime
              mountPath: /run/mariadb
      containers:
        - name: mariadb
          image: {{ printf "%s:%s" .Values.database.image.repository .Values.database.image.tag | quote }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          args:
            - {{ printf "--transaction-isolation=%s" .Values.database.config.transactionIsolation | quote }}
          env:
            - name: HOME
              value: /tmp
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddbgo.databaseSecretName" . }}
                  key: root-password
          securityContext:
            {{- toYaml .Values.database.securityContext | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: data
            - name: runtime
              mountPath: /run/mariadb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ddbgo.databaseClaimName" . }}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.database.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
