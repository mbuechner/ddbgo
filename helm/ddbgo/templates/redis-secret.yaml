{{- if and .Values.redis.enabled .Values.redis.secret.create (not .Values.redis.secret.existingSecret) }}
{{- $name := include "ddbgo.redisName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $passwordPlain := .Values.redis.secret.password | default (randAlphaNum 48) -}}
{{- $password := $passwordPlain | b64enc -}}
{{- $acl := printf "user default on >%s ~* &* +@all\n" $passwordPlain | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- $password = (get (default (dict) $existing.data) "password") | default $password -}}
  {{- $acl = (get (default (dict) $existing.data) "users.acl") | default $acl -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  password: {{ $password | quote }}
  users.acl: {{ $acl | quote }}
{{- end }}
