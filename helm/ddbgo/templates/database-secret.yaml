{{- if and .Values.database.enabled .Values.database.auth.create (not .Values.database.auth.existingSecret) }}
{{- $name := include "ddbgo.databaseName" . -}}
{{- include "ddbgo.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name) }}
{{- $database := .Values.database.auth.database | b64enc -}}
{{- $username := .Values.database.auth.username | b64enc -}}
{{- $password := .Values.database.auth.password | default (randAlphaNum 48) | b64enc -}}
{{- $rootPassword := .Values.database.auth.rootPassword | default (randAlphaNum 48) | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (not .Release.IsInstall) -}}
  {{- $data := default (dict) $existing.data -}}
  {{- $database = (get $data "database") | default $database -}}
  {{- $username = (get $data "username") | default $username -}}
  {{- $password = (get $data "password") | default $password -}}
  {{- $rootPassword = (get $data "root-password") | default $rootPassword -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddbgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    {{- include "ddbgo.protectionAnnotations" . | nindent 4 }}
type: Opaque
immutable: true
data:
  database: {{ $database | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  root-password: {{ $rootPassword | quote }}
{{- end }}

