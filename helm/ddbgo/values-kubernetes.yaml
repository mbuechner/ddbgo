platform:
  type: kubernetes

# Kubernetes besitzt keine OpenShift ImageStreams oder Image-Change-Trigger.
# Always lädt bewegliche Tags bei jedem Podstart neu; automatische Rollouts bei
# einem neuen Digest müssen durch GitOps oder einen separaten Controller erfolgen.
drupal:
  image:
    pullPolicy: Always
    autoUpdate:
      enabled: false

redis:
  image:
    pullPolicy: Always
    autoUpdate:
      enabled: false

database:
  image:
    pullPolicy: Always
    autoUpdate:
      enabled: false
