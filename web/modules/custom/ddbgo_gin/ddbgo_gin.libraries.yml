# Attach components at their entry points; Drupal resolves shared dependencies.
icons:
  css:
    theme:
      css/ddbgo_gin.icons.css: {}

theme_components:
  css:
    theme:
      css/ddbgo_gin.theme-components.css: {}

# Attached only for toolbar users on Gin-based themes.
toolbar_icons:
  css:
    theme:
      css/ddbgo_gin.toolbar-icons.css: {}
  js:
    js/ddbgo_gin.toolbar-navigation.js: {}
  dependencies:
    - core/drupal
    - core/once
    - ddbgo_gin/icons
    - ddbgo_gin/theme_components

# Attached by the workspace block, including its anonymous login variant.
workspace_navigation:
  css:
    theme:
      css/ddbgo_gin.workspace-navigation.css: {}
  js:
    js/ddbgo_gin.workspace-navigation.js: {}
  dependencies:
    - core/drupal
    - core/once
    - ddbgo_gin/icons
    - ddbgo_gin/theme_components

# Attached only by Gin Frontend and its descendants.
frontend_layout:
  css:
    theme:
      css/ddbgo_gin.frontend-layout.css: {}
  js:
    js/ddbgo_gin.exposed-filters.js: {}
  dependencies:
    - core/drupal
    - core/once
    - ddbgo_gin/icons
    - ddbgo_gin/theme_components
    - gin_frontend/global
    # Retain Gin's wrapper/checkbox CSS and support for remaining native controls.
    - gin/gin_description_toggle

# Injected into unique_field_ajax/unique_event by hook_library_info_alter().
# This guard intentionally also runs outside Gin.
unique_field_submit:
  js:
    js/ddbgo_gin.unique-field-submit.js: {}
  dependencies:
    - core/drupal.ajax
    - core/drupalSettings
    - core/once
    - core/drupal.announce

# Attached by the shared help-button template, including AJAX responses.
form_help:
  css:
    theme:
      css/ddbgo_gin.form-help.css: {}
  js:
    js/ddbgo_gin.form-help.js: {}
  dependencies:
    - core/drupal
    - core/once
    # Retain Gin's wrapper/checkbox CSS and support for remaining native controls.
    - gin/gin_description_toggle
